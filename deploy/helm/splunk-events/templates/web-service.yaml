apiVersion: v1
kind: Service
metadata:
  name: {{ include "splunk-events.fullname" . }}-web
  labels:
    {{- include "splunk-events.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "splunk-events.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
