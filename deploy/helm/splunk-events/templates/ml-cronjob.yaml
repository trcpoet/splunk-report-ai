{{- if .Values.ml.enabled }}
# The ML job (ml/score.py): scores every run and learns from the briefing's
# votes, then tells the web app to show the new scores.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "splunk-events.fullname" . }}-ml
  labels:
    {{- include "splunk-events.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml
spec:
  schedule: {{ .Values.ml.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "splunk-events.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: ml
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "splunk-events.podSecurityContext" . | nindent 12 }}
          containers:
            - name: ml
              image: {{ include "splunk-events.image" (dict "root" . "name" .Values.image.ml) }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: APP_URL
                  value: {{ include "splunk-events.webUrl" . | quote }}
                {{- include "splunk-events.secretEnv" (dict "root" . "key" "MONGODB_URI") | nindent 16 }}
                {{- include "splunk-events.secretEnv" (dict "root" . "key" "REVALIDATE_SECRET") | nindent 16 }}
              resources:
                {{- toYaml .Values.ml.resources | nindent 16 }}
              securityContext:
                {{- include "splunk-events.containerSecurityContext" . | nindent 16 }}
{{- end }}
