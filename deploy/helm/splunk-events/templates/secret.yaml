{{- if not .Values.secrets.existingSecret }}
# The app's secrets, made from secrets.values. Fine for trying the chart. For
# real use, point secrets.existingSecret at a Secret your platform manages.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "splunk-events.secretName" . }}
  labels:
    {{- include "splunk-events.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_URI: {{ required "Set secrets.values.MONGODB_URI, or secrets.existingSecret" .Values.secrets.values.MONGODB_URI | quote }}
  BETTER_AUTH_SECRET: {{ required "Set secrets.values.BETTER_AUTH_SECRET, or secrets.existingSecret" .Values.secrets.values.BETTER_AUTH_SECRET | quote }}
  REVALIDATE_SECRET: {{ required "Set secrets.values.REVALIDATE_SECRET, or secrets.existingSecret" .Values.secrets.values.REVALIDATE_SECRET | quote }}
  {{- if .Values.demo.enabled }}
  DEMO_PASSWORD: {{ required "Set secrets.values.DEMO_PASSWORD for demo.enabled" .Values.secrets.values.DEMO_PASSWORD | quote }}
  {{- end }}
  {{- range $key, $value := omit .Values.secrets.values "MONGODB_URI" "BETTER_AUTH_SECRET" "REVALIDATE_SECRET" "DEMO_PASSWORD" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
