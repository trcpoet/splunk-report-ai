# Checks every pull request and every push to main: lint, unit tests and a
# production build, plus the ML job's Python tests and the Docker setup.
# Branch protection on main requires the "Lint, test and build" job to pass,
# so keep that name in sync with the ruleset. "ML (Python)" and "Docker"
# aren't required.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build loads lib/auth-options.ts, which needs these to be set, but
      # nothing connects to the database while building. Placeholders are
      # enough, so no real secrets live in GitHub.
      MONGODB_URI: mongodb://127.0.0.1:27017/splunkevents-ci
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ml:
    name: ML (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      # The tests need no database: they build their runs in memory.
      - run: python -m pytest ml

  # docker compose up from a fresh checkout, as a teammate would (docs/docker.md).
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile ml build
      - name: Start MongoDB, load the demo data and start the app
        run: docker compose up -d
      - name: Wait for the app
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 3
          done
          docker compose ps
          exit 1
      - name: Sign in and read the reports
        run: |
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -d '{"email":"admin@example.com","password":"splunk-demo-2026"}' \
            http://localhost:3000/api/auth/sign-in/email > /dev/null
          curl -fsS -b cookies.txt http://localhost:3000/api/reports | grep -q '"failed-logins-by-user"'
      - name: Run the ML job
        run: docker compose --profile ml run --rm ml
      - name: Show the logs
        if: failure()
        run: docker compose --profile ml logs
      - name: Stop
        if: always()
        run: docker compose --profile ml down -v
