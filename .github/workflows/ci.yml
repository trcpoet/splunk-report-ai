# Checks every pull request and every push to main: lint, unit tests and a
# production build. Branch protection on main requires the "Lint, test and
# build" job to pass, so keep that name in sync with the ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build loads lib/auth-options.ts, which needs these to be set, but
      # nothing connects to the database while building. Placeholders are
      # enough, so no real secrets live in GitHub.
      MONGODB_URI: mongodb://127.0.0.1:27017/splunkevents-ci
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
